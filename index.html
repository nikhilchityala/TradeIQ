<!DOCTYPE html>
<html>
<head>
    <title>TradeIQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>TradeIQ 📊</h1>

<div class="controls">
    <input type="file" id="fileInput">
    <button onclick="readCSV()">Analyze</button>
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="exportPDF()">Export PDF</button>
</div>

<!-- DASHBOARD CARDS -->
     <div class="dashboard-container">
    <div class="card">
        <h3>Profit</h3>
        <p id="profitCard">0</p>
    </div>

    <div class="card">
        <h3>Win Rate</h3>
        <p id="winRateCard">0%</p>
    </div>

    <div class="card">
        <h3>Trades</h3>
        <p id="tradeCard">0</p>
    </div>

    <div class="card">
    <h3>AI Score</h3>
    <p id="aiScoreCard">0</p>
</div>

<div class="card">
    <h3>Max Drawdown</h3>
    <p id="drawdownCard">0</p>
</div>

<div class="card">
    <h3>Best Day</h3>
    <p id="bestDayCard">-</p>
</div>

<div class="card">
    <h3>Worst Day</h3>
    <p id="worstDayCard">-</p>
</div>

<div class="card">
    <h3>Profit Factor</h3>
    <p id="profitFactorCard">0</p>
</div>

<div class="card">
    <h3>Risk-Reward</h3>
    <p id="riskRewardCard">0</p>
</div>

<div class="card">
    <h3>Sharpe Ratio</h3>
    <p id="sharpeRatioCard">0</p>
</div>
</div>

<p id="result"></p>

<!-- TWO SEPARATE CHARTS -->

<canvas id="profitChart" width="500" height="200"></canvas>

<br><br>

<canvas id="equityChart" width="500" height="200"></canvas>

<h3>Daily Breakdown</h3>
<table id="tradeTable">
    <tr>
        <th>Date</th>
        <th>Symbol</th>
        <th>Profit</th>
    </tr>
</table>
  <!-- External JS -->
   <script src="script.js"></script>
</body>
</html>
